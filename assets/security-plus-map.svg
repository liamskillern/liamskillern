<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-label="The Road to Security+: a Middle-earth style map of my progress through the five Security+ exam domains">
<!--
  HOW TO UPDATE MY PROGRESS
  1. Find the waypoint you just finished below (search for class="stop todo" with its name)
     and change "todo" to "done".
  2. Move the "You are here" marker: change the translate(x, y) on the line marked YOU-ARE-HERE
     to that waypoint's x and y.
-->
<defs>
  <radialGradient id="parch" cx="50%" cy="45%" r="75%">
    <stop offset="0%" stop-color="#f6ecd2"/>
    <stop offset="70%" stop-color="#ead8ad"/>
    <stop offset="100%" stop-color="#c9a96b"/>
  </radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  text { font-family: Georgia, "Palatino Linotype", "Book Antiqua", "Times New Roman", serif; fill: #3b2a14; }
  .title { font-size: 30px; font-weight: bold; letter-spacing: 3px; }
  .sub { font-size: 14px; font-style: italic; fill: #5c4424; }
  .place { font-size: 16px; font-weight: bold; }
  .dom { font-size: 12.5px; fill: #4a3518; }
  .stop circle.ring { stroke: #6b4a1e; stroke-width: 3; }
  .todo circle.ring { fill: #f6ecd2; }
  .done circle.ring { fill: #b8860b; }
  .todo .check { display: none; }
  .road { fill: none; stroke: #7a2e1e; stroke-width: 3.5; stroke-dasharray: 10 8; stroke-linecap: round; }
</style>
<rect x="0" y="0" width="1000" height="460" rx="14" fill="url(#parch)"/>
<rect x="10" y="10" width="980" height="440" rx="10" fill="none" stroke="#6b4a1e" stroke-width="2.5"/>
